name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      # Build-time only: route/config collection imports @lokko-hub/db, which requires
      # DATABASE_URL to be set even though no real connection is opened during build.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      BETTER_AUTH_SECRET: placeholder-ci-secret-not-used-at-build-time
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test

  # Post-deploy smoke test, not a pre-merge gate: it runs after main is pushed (i.e. Vercel
  # has already deployed it), against the real deployed site (playwright.config.ts's default
  # baseURL). Running this on pull_request too would test whatever is CURRENTLY live, not the
  # PR's own changes — a preview-URL target would be needed for that, not set up here yet.
  e2e:
    needs: lint-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
      E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - run: npm run test:e2e -w apps/web
